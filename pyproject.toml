[project]
name = "anki-tts-filler"
version = "0.1.0"
description = "Заповнення нотаток в Anki через AnkiConnect з TTS-аудіо"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "edge-tts>=7.2.8",
]

[project.scripts]
anki-tts-filler = "anki_tts_filler.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_tts_filler"]
