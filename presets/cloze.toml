# type-language-no-cloze зараз не має жодної ноти в колекції (перевірено
# через AnkiConnect findCards) - deck_name невідомий, задай перед тим, як
# створювати картки цим пресетом. Режимам audio і pdf deck_name не потрібен.
deck_name = "MyDeck::MySubdeck"
model_name = "type-language-no-cloze"

[cards]
audio_1 = "example_1"

[audio]
no = ["example_1"]
uk = ["translation_1"]

[pdf]
fields = ["title", "example_1", "translation_1", "note"]
