deck_name = "language-no::no-substantiv"
model_name = "type-language-no-substantiv"

[cards]
audio_substantiv = "substantiv"
audio_bestemt_ental = "bestemt_ental"
audio_ubestemt_flertall = "ubestemt_flertall"
audio_bestemt_flertall = "bestemt_flertall"

[audio]
# "linear" - як у Anki, "random" - для фонового слухання, "sorted" - за абеткою
order = "linear"
no = ["substantiv", "bestemt_ental", "ubestemt_flertall", "bestemt_flertall"]
uk = ["substantiv_uk"]

[pdf]
# шпаргалку зручніше читати за абеткою першого рядка
order = "sorted"
fields = ["substantiv", "bestemt_ental", "ubestemt_flertall", "bestemt_flertall", "substantiv_uk", "note"]
