deck_name = "language-no::no-base"
model_name = "type-language-no-basic"

[cards]
audio = "recognition"

[audio]
# "linear" - як у Anki, "random" - для фонового слухання, "sorted" - за абеткою
order = "linear"
target = ["recognition"]
native = ["production"]

[pdf]
# фрази лишаються в порядку з Anki, тобто в порядку уроку: абетка збирала б
# їх у грона за займенником ("Jeg ...", "Han ..."), а не за змістом
order = "linear"
fields = ["recognition", "production", "note"]

# Режим mirror: дублікати цих нот у нотетайп зворотного напрямку.
# production і recognition міняються місцями, тож на лицевому боці дубліката
# опиняється норвезька, а не переклад.
[mirror]
preset = "base-rev"
swap = ["production", "recognition"]
